name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -oq RiyalTrack_Android_Starter.zip

      - name: Fix project settings and code
        working-directory: RiyalTrack_Android
        run: |
          sed -i 's/buildFeatures { compose = true }/buildFeatures { compose = true }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }/' app/build.gradle.kts
          F=app/src/main/java/com/riyaltrack/app/MainActivity.kt
          sed -i 's/^import androidx.activity.ComponentActivity$/import androidx.activity.ComponentActivity\nimport androidx.activity.compose.setContent/' $F
          sed -i 's/Uri.parse(receiptUri)/Uri.parse(receiptUri.orEmpty())/' $F

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: RiyalTrack_Android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RiyalTrack-debug-apk
          path: RiyalTrack_Android/app/build/outputs/apk/debug/app-debug.apk
